<!DOCTYPE html>
<html>
  <head>
    <title>
      button
    </title>
  </head>
  <style>
    .div-button {
      display: flex;
      flex-direction: column;
      background-color: lightpink;
      align-items: center;
      padding-bottom: 20px;
      margin-left: 100px;
      margin-right: 100px;
      box-shadow: 1px 1px 3px black;
       
    }
    .name {
     display: flex;
     width: 200px;
     border-radius: 20px;
     border-color: rgb(182, 162, 162);
     border-style: solid;
     border-width: 1px;
     padding-left: 12px;
     height: 30px;
     margin-bottom: 12px;
     margin-top: 10px;
     font-family: Roboto, Arial;
     font-size: 15px;
    }

    .button {
      background-color: rgb(73, 73, 148);
      margin-left: 12px;
      width: 160px;
      height: 30px;
      width: 190px;
      color: white;
      border-radius: 20px;
      cursor: pointer;
      border-style: solid;
      border-width: 0px;
    }

    .name:hover {
     box-shadow: 2px 2px 3px black;
     transition: box-shadow 0.5s;
    }

    button:hover {
      opacity: 0.9;
      box-shadow: 3px 3px 3px black;
    }

    .button:active {
      opacity: 0.6;
    }

    .sign {
      font-family: Roboto, Arial;
      font-weight: bold;
    }
  </style>
  <body>
     <div class="div-button">
    <form>
      <hi class="sign">
        Sign up to your account.
      </hi>
      <input class="name" type="text" placeholder="Enter your first name" required>
      <input class="name" type="text" placeholder="Enter your last name" required>
      <input class="name" type="email" placeholder="Enter your email address" required>
      <input class="name" type="password" placeholder="Enter your password" required>
      <button class="button">
        Sign up
      </button>
    </form>
    </div>
  </body>
</html>

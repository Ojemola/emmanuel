<!DOCTYPE html>
<html>
  <head>
    <title>
       creating form
    </title>
    <style>
      .flex-box {
        background-color: rgb(243, 233, 233);
        display: flex;
        flex-direction: column;
        align-items: center;
        box-shadow: 1px 1px 5px black;
        position: absolute;
        right: 0;
        width: 300px;
        left: 540px;
        bottom: 250px;
        padding-top: 20px;
        padding-bottom: 20px;
      }

      .first-name {
        margin-bottom: 30px;
        height: 30px;
        font-size: 15px;
        padding-left: 12px;
        border-radius: 50px;
        border-color: rgb(231, 219, 219);
        border-style: solid;
        box-shadow: 1px 1px 2px black;
      }

      .button {
        padding: 10px 80px 10px 80px;
        border-radius: 8px;
        border-style: solid;
        border-color: lightgrey;
       
        background-color: rgb(55, 55, 206);
        border-width: 0px;
        color: white;
        font-size: 15px;
        font-weight: bold;
        font-family: Roboto, Arial;
        cursor: pointer;
        transition: box-shadow 0.2s;
        transition: opacity 0.5s;
      }

      .button:hover {
       opacity: 0.7;
         box-shadow: 2px 2px 3px black;
      }

      .button:active {
        opacity: 0.3;
      }



    </style>
  </head>
  <body class="body">
 <form>
  <div class="flex-box">
    <input class="first-name" type="text" placeholder="Enter your firs name" required>

    <input class="first-name" type="text" placeholder="Enter you surname" required>

    <input class="first-name" type="email" placeholder="Email adress" required>

    <input class="first-name" type="password" name="Password" placeholder="Enter your password" required>

    <div>
      <button class="button">
        sign up
      </button>
    </div>
  </div>
 </form>
  </body>
</html>

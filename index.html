<!DOCTYPE html>
<html>
  <head>
    <title>
       creating form
    </title>
    <style>
      .flex-box {
        background-color: rgb(155, 150, 150);
        display: flex;
        flex-direction: column;
        align-items: center;
        box-shadow: 1px 1px 5px black;
        width: 100%;
        min-height: 100vh
      }

      .first-name {
        margin-bottom: 30px;
        height: 30px;
        font-size: 15px;
        padding-left: 12px;
        border-radius: 50px;
        border-color: rgb(231, 219, 219);
        border-style: solid;
        transition: box-shadow 0.5s;
      }

      .first-name:hover {
         box-shadow: 2px 2px 2px black;
      }

      .button {
        padding: 10px 80px 10px 80px;
        border-radius: 8px;
        border-style: solid;
        border-color: lightgrey;
       
        background-color: rgb(55, 55, 206);
        border-width: 0px;
        color: white;
        font-size: 15px;
        font-weight: bold;
        font-family: Roboto, Arial;
        cursor: pointer;
        transition: box-shadow 0.2s;
        transition: opacity 0.5s;
      }

      .button:hover {
       opacity: 0.7;
         box-shadow: 2px 2px 3px black;
      }

      .button:active {
        opacity: 0.3;
      }


      .sign {
        font-family: Roboto, Arial;
      }

      body {
        margin: 0;
        min-height: 100vh
      }

      .division {
        display: flex;
        flex-direction: column;
        align-items: center;
       justify-content: center;
       background-color: white;
       padding: 10px 50px 50px 50px;
       box-shadow: 1px 1px 3px; rgb(184, 117, 117);
       border-style: solid;
       border-width: 0px;
       right: 0;
       position: absolute;
       left: 0;
       top: 0;
       bottom: 0;
      }
    </style>
  </head>
  <body class="body">
 <form>
  <div class="flex-box">
    <div class="division">
    <h1 class="sign">
      Sign up to your account.
    </h1>
    <input class="first-name" type="text" placeholder="Enter your firs name" required>

    <input class="first-name" type="text" placeholder="Enter you surname" required>

    <input class="first-name" type="email" placeholder="Email adress" required>

    <input class="first-name" type="password" name="Password" placeholder="Enter your password" required>

    <div>
      <button class="button">
        sign up
      </button>
     
    </div>
      </div>
  </div>
 </form>
  </body>
</html>
